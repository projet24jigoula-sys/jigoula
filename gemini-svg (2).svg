  <path d="M136,95 C136,77 151.2,62 170,62 C188.8,62 204,77 204,95" fill="none" stroke="#A6D8D2" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M150,95 C150,84 159,75 170,75 C181,75 190,84 190,95" fill="none" stroke="#FAFAF8" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- The Core Point -->
